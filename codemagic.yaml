workflows:
  jalanku-android-debug:
    name: JalanKu Android debug APK
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Generate or update Android platform files
        script: flutter create --platforms=android --org com.example.jalanku --project-name jalanku .
      - name: Resolve packages
        script: flutter pub get
      - name: Static analysis
        script: flutter analyze
      - name: Widget tests
        script: flutter test
      - name: Build Android debug APK
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
      - build/**/outputs/**/*.log
